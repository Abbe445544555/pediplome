<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول · دبلوم إعداد معلمي ومعلمات التربية البدنية</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0c2d57">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="login">
  <main class="login-wrap">
    <section class="login-brand">
      <span class="logo">SIOSS</span>
      <p class="org">المنظمة السويدية الدولية للعلوم الرياضية</p>
      <h1>دبلوم إعداد معلمي ومعلمات التربية البدنية</h1>
      <img src="assets/img/main-course.png" alt="" width="960" height="640">
    </section>
    <section class="login-card" aria-labelledby="login-h">
      <h2 id="login-h">تسجيل الدخول</h2>
      <p class="login-lead">أدخل اسم المستخدم وكلمة المرور للوصول إلى محتوى الدورة.</p>
      <form id="loginForm" novalidate>
        <label for="username">اسم المستخدم</label>
        <input id="username" name="username" type="text" dir="ltr" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        <label for="password">كلمة المرور</label>
        <div class="pw">
          <input id="password" name="password" type="password" dir="ltr" autocomplete="current-password" required>
          <button type="button" id="togglePw" aria-pressed="false">إظهار</button>
        </div>
        <p class="login-error" id="errorMsg" role="alert"></p>
        <button type="submit" class="btn-main" id="submitBtn">دخول</button>
      </form>
    </section>
  </main>
  <footer class="foot"><p>© المنظمة السويدية الدولية للعلوم الرياضية (SIOSS)</p><p class="credit"><a href="https://wa.me/8801761482306?text=I%20have%20come%20from%20the%20pediplome%20website%20to%20contact%20you:%0A%0A%0A%0A" target="_blank" rel="noopener">Developed by Ashikur Rahman</a></p></footer>
  <script>
  (function () {
    var STORED = 'd2542fc7a23d470a69cab006476861c212449103c4780eb1860a256744e67b72';
    async function siossKey(user, pass) {
      var enc = new TextEncoder();
      var key = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveBits']);
      var bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode('sioss-pediplome:' + user), iterations: 120000 }, key, 256);
      return Array.prototype.map.call(new Uint8Array(bits), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
    }
    window.siossKey = siossKey;   /* لتغيير بيانات الدخول: انظر README */
    var form = document.getElementById('loginForm');
    var user = document.getElementById('username');
    var pass = document.getElementById('password');
    var err = document.getElementById('errorMsg');
    var btn = document.getElementById('submitBtn');
    var toggle = document.getElementById('togglePw');
    toggle.addEventListener('click', function () {
      var show = pass.type === 'password';
      pass.type = show ? 'text' : 'password';
      toggle.textContent = show ? 'إخفاء' : 'إظهار';
      toggle.setAttribute('aria-pressed', show ? 'true' : 'false');
    });
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var u = user.value.trim(), p = pass.value.trim();
      if (!u || !p) { err.textContent = 'اكتب اسم المستخدم وكلمة المرور.'; return; }
      if (!window.crypto || !crypto.subtle) { err.textContent = 'هذا المتصفح لا يدعم تسجيل الدخول. جرّب متصفحاً أحدث.'; return; }
      btn.disabled = true; err.textContent = '';
      siossKey(u, p).then(function (k) {
        if (k === STORED) {
          try { localStorage.setItem('loggedIn', 'true'); } catch (x) {}
          var next = new URLSearchParams(location.search).get('next');
          location.href = next && /^[\w-]+\.html$/.test(next) ? next : 'course.html';
        } else {
          err.textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة.';
          btn.disabled = false; pass.select();
        }
      }).catch(function () { err.textContent = 'تعذّر التحقق. حدّث الصفحة وحاول مرة أخرى.'; btn.disabled = false; });
    });
  })();
  </script>
</body>
</html>
